name: OSV-Scanner PR Scan
on:
  pull_request:
    branches: [master]
  merge_group:
    branches: [master]
permissions:
  actions: read
  security-events: write
  contents: read
jobs:
  scan-pr:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0"
    with:
      upload-sarif: true
